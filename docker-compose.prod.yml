# Botera Shop in production (AA-038). Guide: docs/engineering/DEPLOYMENT.md.
#
#   cp .env.production.example .env.production   # fill every value
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# --env-file is required: compose takes ${...} values (passwords) from it.
#
# Differences from the development docker-compose.yml: production settings
# (core.settings.production refuses unsafe values), gunicorn instead of
# runserver, no mounted code, an unprivileged user, Redis with a password,
# no demo data, daily database backups. The web port listens on 127.0.0.1
# only: put a reverse proxy with HTTPS (Caddy, nginx) in front of it.
name: botera-shop-prod

x-app: &app
  build:
    context: .
    dockerfile: infrastructure/docker/Dockerfile
  image: botera-shop:prod
  user: app
  env_file:
    - .env.production
  environment:
    DJANGO_SETTINGS_MODULE: core.settings.production
    DJANGO_USE_SQLITE: "false"
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    REDIS_URL: redis://:${REDIS_PASSWORD:?задайте REDIS_PASSWORD в .env.production}@redis:6379/0
    CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
    CELERY_TASK_ALWAYS_EAGER: "false"
  restart: always

x-after-init: &after-init
  depends_on:
    init:
      condition: service_completed_successfully
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?задайте POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?задайте POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD}
      TZ: Europe/Kyiv
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: always

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: always

  # Settings checks (check --deploy) and migrations, then exits.
  init:
    <<: *app
    command: ["sh", "infrastructure/docker/init.sh"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    <<: [*app, *after-init]
    command:
      - sh
      - -c
      - >-
        python manage.py collectstatic --noinput --verbosity 0 &&
        exec gunicorn core.wsgi:application --bind 0.0.0.0:8000
        --workers ${WEB_WORKERS:-3} --timeout 60
        --access-logfile - --forwarded-allow-ips '*'
    ports:
      - "127.0.0.1:${WEB_PORT_ON_HOST:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          host = os.environ['DJANGO_ALLOWED_HOSTS'].split(',')[0].strip();
          urllib.request.urlopen(urllib.request.Request('http://localhost:8000/health/',
          headers={'Host': host, 'X-Forwarded-Proto': 'https'}), timeout=3)
      interval: 15s
      timeout: 5s
      retries: 6

  worker:
    <<: [*app, *after-init]
    command: ["celery", "-A", "core.celery", "worker", "-Q", "default,broadcasts", "--loglevel=info"]

  # Exactly one beat and one bot service (two pollers of a token conflict).
  beat:
    <<: [*app, *after-init]
    command:
      - celery
      - -A
      - core.celery
      - beat
      - --loglevel=info
      - --schedule=/tmp/celerybeat-schedule

  bot:
    <<: [*app, *after-init]
    # BOT_PROCESSES: bots split over N processes, each bot in exactly one
    # (one process uses one CPU core; docs/engineering/LOAD_TESTING.md).
    command: ["python", "manage.py", "runbot", "--wait", "--processes", "${BOT_PROCESSES:-1}"]

  backup:
    image: postgres:16-alpine
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGDATABASE: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: Europe/Kyiv
    command: ["sh", "/scripts/backup.sh"]
    volumes:
      - ./infrastructure/docker/backup.sh:/scripts/backup.sh:ro
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: always

volumes:
  postgres_data:
  redis_data:
  backups:
