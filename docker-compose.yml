services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tableos}
      POSTGRES_USER: ${POSTGRES_USER:-tableos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tableos}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    env_file:
      - .env
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    env_file:
      - .env
    command: celery -A core.celery worker -Q default,broadcasts --loglevel=info
    volumes:
      - .:/app
    depends_on:
      - db
      - redis

  # Periodic jobs: scheduled broadcasts, stalled-broadcast recovery, daily
  # metrics (core/settings/base.py:CELERY_BEAT_SCHEDULE). Run exactly one.
  beat:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    env_file:
      - .env
    command: celery -A core.celery beat --loglevel=info --schedule /tmp/celerybeat-schedule
    volumes:
      - .:/app
    depends_on:
      - db
      - redis

  # Telegram polling for every active partner bot (bot/management/commands/runbot.py).
  # Run exactly one: two pollers of the same token conflict.
  bot:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    env_file:
      - .env
    command: python manage.py runbot
    restart: unless-stopped
    volumes:
      - .:/app
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
