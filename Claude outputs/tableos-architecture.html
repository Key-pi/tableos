<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TableOS — Архитектура</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22253a;
    --border: #2d3250;
    --accent: #6c7ef8;
    --accent2: #f89c6c;
    --accent3: #6cf8c7;
    --accent4: #f86c8f;
    --text: #e4e6f1;
    --text2: #8b8fa8;
    --text3: #bbbdd4;
    --shadow: 0 4px 24px rgba(0,0,0,0.5);
    --highlight: #6c7ef833;
    --node-r: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    z-index: 10;
  }
  header h1 { font-size: 17px; font-weight: 600; letter-spacing: .02em; }
  header .badge {
    font-size: 11px; background: var(--accent); color: #fff;
    border-radius: 6px; padding: 2px 8px; font-weight: 500;
  }
  header .hint { font-size: 12px; color: var(--text2); margin-left: auto; }
  .workspace {
    display: flex;
    flex: 1;
    overflow: hidden;
  }
  /* ===== CANVAS ===== */
  #canvas-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  svg#diagram {
    width: 100%;
    height: 100%;
    cursor: grab;
    user-select: none;
  }
  svg#diagram:active { cursor: grabbing; }

  /* ===== SIDEBAR ===== */
  #sidebar {
    width: 300px;
    flex-shrink: 0;
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #sidebar-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    font-weight: 600;
    color: var(--text2);
    letter-spacing: .05em;
    text-transform: uppercase;
  }
  #flows-list {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
  }
  #flows-list::-webkit-scrollbar { width: 4px; }
  #flows-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .flow-item {
    padding: 10px 14px;
    border-radius: 10px;
    margin-bottom: 8px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all .18s ease;
    background: var(--surface2);
  }
  .flow-item:hover { border-color: var(--accent); background: var(--highlight); }
  .flow-item.active { border-color: var(--accent); background: var(--highlight); }
  .flow-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .flow-desc { font-size: 11px; color: var(--text2); line-height: 1.5; }
  .flow-dot {
    display: inline-block; width: 8px; height: 8px;
    border-radius: 50%; margin-right: 8px; flex-shrink: 0;
  }

  /* ===== INFO PANEL (node detail) ===== */
  #info-panel {
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    min-height: 0;
    max-height: 220px;
    overflow-y: auto;
    transition: all .2s ease;
  }
  #info-panel h3 { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  #info-panel p { font-size: 12px; color: var(--text3); line-height: 1.6; }
  #info-panel .pill {
    display: inline-block; font-size: 10px; padding: 2px 8px;
    background: var(--surface2); border-radius: 20px; margin: 3px 3px 0 0;
    color: var(--text3); border: 1px solid var(--border);
  }
  #info-panel .info-label {
    font-size: 10px; color: var(--text2); text-transform: uppercase;
    letter-spacing: .07em; margin-top: 10px; margin-bottom: 4px;
  }

  /* ===== TOOLTIP ===== */
  #tooltip {
    position: fixed;
    pointer-events: none;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 12px;
    max-width: 220px;
    box-shadow: var(--shadow);
    z-index: 100;
    display: none;
    line-height: 1.6;
  }
  #tooltip .tt-title { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
  #tooltip .tt-body { color: var(--text3); }

  /* ===== NODE STYLES (injected via JS) ===== */
  .node-group { cursor: pointer; }
  .node-rect { rx: 12; transition: filter .15s; }
  .node-group:hover .node-rect { filter: brightness(1.25); }
  .node-label { font-size: 12px; font-weight: 600; fill: #fff; pointer-events: none; }
  .node-sublabel { font-size: 10px; fill: rgba(255,255,255,.55); pointer-events: none; }
  .edge { stroke-width: 1.5; fill: none; marker-end: url(#arrow); opacity: .5; transition: opacity .2s, stroke-width .2s; }
  .edge.highlighted { opacity: 1; stroke-width: 2.5; }
  .edge-label { font-size: 9px; fill: var(--text2); pointer-events: none; }

  /* ===== LEGEND ===== */
  #legend {
    position: absolute;
    bottom: 16px;
    left: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 11px;
    z-index: 5;
  }
  #legend .legend-title { color: var(--text2); margin-bottom: 8px; font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; }
  .legend-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }

  /* ===== ZOOM CONTROLS ===== */
  #zoom-controls {
    position: absolute;
    bottom: 16px;
    right: 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    z-index: 5;
  }
  .zoom-btn {
    width: 32px; height: 32px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s;
  }
  .zoom-btn:hover { background: var(--surface2); }
</style>
</head>
<body>

<header>
  <h1>TableOS · Архитектура системы</h1>
  <span class="badge">Django Monolith</span>
  <span class="hint">Наведите на узел — тултип · Кликните на flow — подсветить путь · Перетащите для навигации</span>
</header>

<div class="workspace">
  <div id="canvas-wrap">
    <svg id="diagram" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
          <path d="M0,0 L0,6 L8,3 z" fill="#4a5180"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
          <path d="M0,0 L0,6 L8,3 z" fill="#6c7ef8"/>
        </marker>
        <filter id="glow">
          <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
          <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <g id="diagram-root"></g>
    </svg>
    <div id="legend">
      <div class="legend-title">Слои</div>
      <div class="legend-row"><div class="legend-dot" style="background:#4a6fa5"></div><span>Инфраструктура</span></div>
      <div class="legend-row"><div class="legend-dot" style="background:#4a7a5a"></div><span>Адаптеры</span></div>
      <div class="legend-row"><div class="legend-dot" style="background:#7a4a8a"></div><span>Домен (apps/)</span></div>
      <div class="legend-row"><div class="legend-dot" style="background:#8a6a3a"></div><span>Core</span></div>
      <div class="legend-row"><div class="legend-dot" style="background:#4a6a8a"></div><span>Хранилища</span></div>
    </div>
    <div id="zoom-controls">
      <button class="zoom-btn" id="zoom-in">+</button>
      <button class="zoom-btn" id="zoom-out">−</button>
      <button class="zoom-btn" id="zoom-reset" title="Сбросить вид" style="font-size:12px">⌖</button>
    </div>
  </div>

  <div id="sidebar">

    <div id="flows-list"></div>
    <div id="info-panel">

  </div>
</div>

<div id="tooltip">
  <div class="tt-title" id="tt-title"></div>
  <div class="tt-body" id="tt-body"></div>
</div>

// ======================================================
// RENDER
// ======================================================
const svg = document.getElementById("diagram");
const root = document.getElementById("diagram-root");
let viewBox = { x: -50, y: -20, w: 1050, h: 800 };
let dragging = false, lastMx = 0, lastMy = 0;
let activeFlow = null;

// ── Build edge map for quick lookup
const edgeIndex = {};
EDGES.forEach(e => { edgeIndex[`${e.from}->${e.to}`] = e; });

// ── Render edges
function getNodeCenter(id) {
  const n = NODES.find(x => x.id === id);
  return n ? { x: n.x + 70, y: n.y + 28 } : { x: 0, y: 0 };
}

function renderEdges(highlightSet) {
  const g = document.getElementById("edges-layer") || document.createElementNS("http://www.w3.org/2000/svg", "g");
  g.id = "edges-layer";
  g.innerHTML = "";
  EDGES.forEach(e => {
    const from = getNodeCenter(e.from);
    const to = getNodeCenter(e.to);
    const isHl = highlightSet && highlightSet.has(`${e.from}->${e.to}`);
    const dx = to.x - from.x, dy = to.y - from.y;
    const mx = from.x + dx * 0.5, my = from.y + dy * 0.5;
    const cx1 = from.x + dx * 0.3, cy1 = from.y;
    const cx2 = to.x - dx * 0.3, cy2 = to.y;

    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", `M${from.x},${from.y} C${cx1},${cy1} ${cx2},${cy2} ${to.x},${to.y}`);
    path.setAttribute("class", "edge" + (isHl ? " highlighted" : ""));
    path.setAttribute("stroke", isHl ? "#6c7ef8" : "#3a3f60");
    path.setAttribute("marker-end", isHl ? "url(#arrow-accent)" : "url(#arrow)");
    g.appendChild(path);

    if (e.label && isHl) {
      const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
      text.setAttribute("x", mx); text.setAttribute("y", my - 4);
      text.setAttribute("text-anchor", "middle");
      text.setAttribute("class", "edge-label");
      text.textContent = e.label;
      g.appendChild(text);
    }
  });
  root.insertBefore(g, root.firstChild);
}

// ── Render nodes
function renderNodes(highlightSet) {
  let ng = document.getElementById("nodes-layer");
  if (ng) ng.remove();
  ng = document.createElementNS("http://www.w3.org/2000/svg", "g");
  ng.id = "nodes-layer";
  NODES.forEach(n => {
    const isHl = highlightSet && highlightSet.has(n.id);
    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.setAttribute("class", "node-group");
    g.setAttribute("data-id", n.id);

    const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    rect.setAttribute("x", n.x); rect.setAttribute("y", n.y);
    rect.setAttribute("width", 140); rect.setAttribute("height", 56);
    rect.setAttribute("rx", 12);
    rect.setAttribute("class", "node-rect");
    rect.setAttribute("fill", isHl ? lighten(n.color, 30) : n.color);
    rect.setAttribute("stroke", isHl ? "#6c7ef8" : "rgba(255,255,255,.1)");
    rect.setAttribute("stroke-width", isHl ? 2.5 : 1);
    if (isHl) rect.setAttribute("filter", "url(#glow)");
    g.appendChild(rect);

    const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
    label.setAttribute("x", n.x + 70); label.setAttribute("y", n.y + 24);
    label.setAttribute("text-anchor", "middle"); label.setAttribute("class", "node-label");
    label.textContent = n.label;
    g.appendChild(label);

    const sub = document.createElementNS("http://www.w3.org/2000/svg", "text");
    sub.setAttribute("x", n.x + 70); sub.setAttribute("y", n.y + 40);
    sub.setAttribute("text-anchor", "middle"); sub.setAttribute("class", "node-sublabel");
    sub.textContent = n.sub;
    g.appendChild(sub);

    g.addEventListener("mouseenter", (evt) => showTooltip(evt, n));
    g.addEventListener("mousemove", (evt) => moveTooltip(evt));
    g.addEventListener("mouseleave", hideTooltip);
    g.addEventListener("click", () => selectNode(n));
    ng.appendChild(g);
  });
  root.appendChild(ng);
}

function lighten(hex, amt) {
  let r = parseInt(hex.slice(1,3),16);
  let g = parseInt(hex.slice(3,5),16);
  let b = parseInt(hex.slice(5,7),16);
  r = Math.min(255, r + amt); g = Math.min(255, g + amt); b = Math.min(255, b + amt);
  return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
}

function applyViewBox() {
  svg.setAttribute("viewBox", `${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`);
}

function render(flowEdges, flowNodes) {
  renderEdges(flowEdges);
  renderNodes(flowNodes);
  applyViewBox();
}

// ── Tooltip
const tooltip = document.getElementById("tooltip");
function showTooltip(evt, node) {
  document.getElementById("tt-title").textContent = node.label + (node.sub ? ` — ${node.sub}` : "");
  document.getElementById("tt-body").textContent = node.desc;
  tooltip.style.display = "block";
  moveTooltip(evt);
}
function moveTooltip(evt) {
  let x = evt.clientX + 14, y = evt.clientY - 10;
  if (x + 230 > window.innerWidth) x = evt.clientX - 240;
  tooltip.style.left = x + "px"; tooltip.style.top = y + "px";
}
function hideTooltip() { tooltip.style.display = "none"; }

// ── Node selection → info panel
function selectNode(node) {
  const panel = document.getElementById("info-panel");
  panel.innerHTML = `
    <h3>${node.label}</h3>
    <p>${node.desc}</p>
    <div class="info-label">Теги</div>
    <div>${(node.tags||[]).map(t=>`<span class="pill">${t}</span>`).join("")}</div>
  `;
}

// ── Flow selection
function buildFlowsList() {
  const list = document.getElementById("flows-list");
  list.innerHTML = "";
  FLOWS.forEach(flow => {
    const div = document.createElement("div");
    div.className = "flow-item";
    div.dataset.id = flow.id;
    div.innerHTML = `
      <div class="flow-title">
        <span class="flow-dot" style="background:${flow.color}"></span>${flow.label}
      </div>
      <div class="flow-desc">${flow.desc}</div>
    `;
    div.addEventListener("click", () => selectFlow(flow, div));
    list.appendChild(div);
  });
}

function selectFlow(flow, el) {
  document.querySelectorAll(".flow-item").forEach(x => x.classList.remove("active"));
  if (activeFlow === flow.id) {
    activeFlow = null;
    render(null, null);
    const panel = document.getElementById("info-panel");
    panel.innerHTML = `<div style="color:var(--text2);font-size:12px">Кликните на узел или поток для подробностей</div>`;
    return;
  }
  el.classList.add("active");
  activeFlow = flow.id;

  const flowEdges = new Set(flow.edges.map(([a,b]) => `${a}->${b}`));
  const flowNodes = new Set(flow.steps.map(s => s.node));

  render(flowEdges, flowNodes);

  // Info panel: steps list
  const panel = document.getElementById("info-panel");
  panel.innerHTML = `
    <h3 style="color:${flow.color}">${flow.label}</h3>
    <p style="margin-bottom:8px">${flow.desc}</p>
    <div class="info-label">Шаги</div>
    ${flow.steps.map((s,i) => {
      const node = NODES.find(n => n.id === s.node);
      return `<div style="font-size:11px;margin-bottom:4px;display:flex;gap:6px">
        <span style="color:${flow.color};font-weight:600">${i+1}.</span>
        <span><strong>${node ? node.label : s.node}</strong> — ${s.note}</span>
      </div>`;
    }).join("")}
  `;
}

// ── Pan
svg.addEventListener("mousedown", e => {
  if (e.target.closest(".node-group")) return;
  dragging = true; lastMx = e.clientX; lastMy = e.clientY;
});
window.addEventListener("mousemove", e => {
  if (!dragging) return;
  const dx = (e.clientX - lastMx) * (viewBox.w / svg.clientWidth);
  const dy = (e.clientY - lastMy) * (viewBox.h / svg.clientHeight);
  viewBox.x -= dx; viewBox.y -= dy;
  lastMx = e.clientX; lastMy = e.clientY;
  applyViewBox();
});
window.addEventListener("mouseup", () => { dragging = false; });

// ── Zoom via scroll
svg.addEventListener("wheel", e => {
  e.preventDefault();
  const factor = e.deltaY > 0 ? 1.12 : 0.89;
  const rect = svg.getBoundingClientRect();
  const mx = (e.clientX - rect.left) / rect.width;
  const my = (e.clientY - rect.top) / rect.height;
  const ox = viewBox.x + viewBox.w * mx;
  const oy = viewBox.y + viewBox.h * my;
  viewBox.w *= factor; viewBox.h *= factor;
  viewBox.x = ox - viewBox.w * mx;
  viewBox.y = oy - viewBox.h * my;
  applyViewBox();
}, { passive: false });

document.getElementById("zoom-in").onclick = () => {
  viewBox.x += viewBox.w * 0.1; viewBox.y += viewBox.h * 0.1;
  viewBox.w *= 0.8; viewBox.h *= 0.8; applyViewBox();
};
document.getElementById("zoom-out").onclick = () => {
  viewBox.x -= viewBox.w * 0.125; viewBox.y -= viewBox.h * 0.125;
  viewBox.w *= 1.25; viewBox.h *= 1.25; applyViewBox();
};
document.getElementById("zoom-reset").onclick = () => {
  viewBox = { x: -50, y: -20, w: 1050, h: 800 }; applyViewBox();
};

// ── Init
buildFlowsList();
render(null, null);
</script>
