{% load webapp_assets %}<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Botera Shop</title>
  <style>
    html, body { min-height: 100%; background: var(--tg-theme-secondary-bg-color, #f2f3f5); color: var(--tg-theme-text-color, #16181d); }
  </style>
  <script>
    window.addEventListener("error", function (event) {
      var box = document.getElementById("app");
      var target = event.target || {};
      var file = (target.src || target.href || event.filename || "").split("/").pop();
      var text = target.src || target.href ? "not loaded" : (event.message || "error");
      if (box && box.querySelector(".spinner")) {
        box.textContent = "⚠️ " + text + " (" + file + ")";
        box.style.padding = "24px";
      }
    }, true);
  </script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="{% asset 'webapp/guest.css' %}">
  <link rel="stylesheet" href="{% asset 'webapp/staff.css' %}">
</head>
<body>
  <main id="app" data-api="{% url 'webapp:guest' bot_hex %}api/staff/" aria-live="polite">
    <div class="center"><div class="spinner" role="status"></div></div>
  </main>
  <div id="toast" class="toast" role="alert" hidden></div>
  <script src="{% asset 'webapp/staff.js' %}"></script>
</body>
</html>
